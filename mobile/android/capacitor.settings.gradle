// ============================================================================
// Capacitor plugin modules for the EduSphere mobile app.
//
// THIS FILE IS REGENERATED by `npx cap sync android`. It is committed so the
// committed Gradle project builds without running cap first (CI does both).
// The paths point at mobile/node_modules, which is git-ignored — run
// `npm install` in mobile/ before grading.
// ============================================================================
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = new File('../node_modules/@capacitor/app/android')

include ':capacitor-network'
project(':capacitor-network').projectDir = new File('../node_modules/@capacitor/network/android')
