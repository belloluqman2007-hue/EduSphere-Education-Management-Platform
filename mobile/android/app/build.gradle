// ============================================================================
// EduSphere mobile — Android application module
// ----------------------------------------------------------------------------
// Two things matter here and nowhere else:
//
//  1. SIGNING. A release build is signed with the school's upload keystore when
//     the EDUSPHERE_KEYSTORE_* secrets exist, and with the DEBUG key when they
//     do not. That fallback is deliberate: CI (and a school with no Play
//     account) must still produce an .apk that installs. `docs/MOBILE-APP.md`
//     explains the difference.
//
//  2. The app id must stay `app.edusphere.mobile` (it is also the iOS bundle id
//     and the capacitor.config.ts appId).
// ============================================================================
apply plugin: 'com.android.application'

def hasReleaseKeystore = System.getenv("EDUSPHERE_KEYSTORE_PATH") != null &&
        System.getenv("EDUSPHERE_KEYSTORE_PASSWORD") != null &&
        System.getenv("EDUSPHERE_KEY_ALIAS") != null

android {
    namespace "app.edusphere.mobile"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.edusphere.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Keep hidden/backup files out of the packaged WebView assets.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(System.getenv("EDUSPHERE_KEYSTORE_PATH"))
                storePassword System.getenv("EDUSPHERE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("EDUSPHERE_KEY_ALIAS")
                keyPassword System.getenv("EDUSPHERE_KEY_PASSWORD") ?: System.getenv("EDUSPHERE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No keystore secrets ⇒ debug-signed release build (installs, cannot
            // be uploaded to Play — documented).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    lint {
        abortOnError false
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-network')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
