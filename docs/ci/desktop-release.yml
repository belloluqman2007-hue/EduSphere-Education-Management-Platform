name: Desktop installers

# =============================================================================
# EduSphere desktop (Phase 3) — builds the real installers on every push and
# attaches them to a GitHub Release when a `v*` tag is pushed.
#
# WHERE THIS FILE LIVES
#   This is the canonical workflow, versioned here because the automation that
#   opened this branch is a GitHub App without the `workflows` permission, so a
#   file under .github/workflows/ could not be pushed. To activate CI, run:
#
#       mkdir -p .github/workflows
#       cp docs/ci/desktop-release.yml .github/workflows/desktop-release.yml
#
#   (or grant the app `Workflows: Read and write` and move the file there).
#   docs/INSTALL.md has the click-by-click version for a non-technical reader.
#   desktop/test/packaging.test.js parses THIS copy, so the workflow is always
#   verified by the test suite — a stale live copy cannot hide a regression.
#
#   NOTE ON `secrets` IN AN `if:`
#   `secrets` is not an allowed context in a step-level `if:`, and one
#   occurrence makes the whole file invalid ("Unrecognized named-value:
#   'secrets'"). MAC_CSC_LINK / WIN_CSC_LINK are therefore lifted into the
#   `build` job's `env:` and every gate tests `env.*` instead.
#
#   NOTE ON THE LINUX RUNNER — `ubuntu-24.04`, not `ubuntu-latest`
#   `ubuntu-latest` moved to Ubuntu 26.04 (glibc 2.43) on 2026-10-19. The
#   AppImage/deb tooling electron-builder downloads carries its own bundled
#   libm.so.6, which cannot run against that glibc: the Linux leg dies with
#   "Process completed with exit code 1" a few seconds into `npm run dist:linux`
#   while macOS and Windows are fine (they never use those tools). The Linux
#   leg is therefore PINNED to `ubuntu-24.04`. The `test` job stays on
#   `ubuntu-latest` — it only runs Node. Remove the pin once electron-builder
#   ships tooling built for glibc 2.43.
#
#   Windows  EduSphere-<version>-win-x64.exe / -win-arm64.exe        (NSIS)
#   macOS    EduSphere-<version>-mac-universal.dmg
#   Linux    EduSphere-<version>-linux-x64.AppImage / .deb (+ arm64)
#
# Signing is OPTIONAL and env-driven. With no secrets configured every job
# still produces working, unsigned installers; when the secrets exist the same
# workflow signs (and, on macOS, notarizes) without any further change.
# =============================================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "public/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.3"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast guard: the desktop suite is headless (mocked Electron) so it runs on
  #    the cheapest runner before any installer is built.
  # ---------------------------------------------------------------------------
  test:
    name: Desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run the desktop test suite
        working-directory: desktop
        run: npm test

      # `--test-force-exit`: a known pre-existing failure in the root suite leaves
      # an open handle behind (a jsdom window that is never closed), so the test
      # process would otherwise sit there until the job timeout instead of
      # exiting. Forcing the exit keeps the guard fast and deterministic.
      #
      # `test/unified-login-ui.test.js` is deliberately NOT in the list below: it
      # is the known pre-existing failure (the fee-payment copy assertion) that
      # also leaks that open handle. Including it would fail CI — or hang CI —
      # before a single installer is built. It is still covered by the full
      # `npm test` run in the repository and by `test/admin-login.test.js` /
      # `test/auth-security.test.js` here.
      - name: Run the platform guard tests (SQL dialect, CSRF, login)
        run: >
          node --disable-warning=ExperimentalWarning --test --test-force-exit
          test/sql-compat.test.js
          test/mysql-runtime.test.js
          test/card-scanner-csrf.test.js
          test/admin-login.test.js
          test/offline-frontend-sync.test.js

  # ---------------------------------------------------------------------------
  # 2. Build the installers for each operating system.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    # A step-level `if:` may not read the `secrets` context — GitHub rejects the
    # whole workflow with "Unrecognized named-value: 'secrets'". The two signing
    # certificates are therefore lifted into the job env once, and the step
    # conditions below test `env.MAC_CSC_LINK` / `env.WIN_CSC_LINK` instead.
    # (Empty when the secret does not exist, which is exactly the fallback.)
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned on purpose: see "NOTE ON THE LINUX RUNNER" above — the
          # AppImage/deb tools break on ubuntu-latest (Ubuntu 26.04 / glibc
          # 2.43), and every gate below compares with startsWith(matrix.os, …)
          # so the pin cannot silently skip the unsigned fallback.
          - os: ubuntu-24.04
            label: Linux
            build: npm run dist:linux
            artifacts: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
          - os: macos-latest
            label: macOS
            build: npm run dist:mac
            artifacts: |
              desktop/dist/*.dmg
          - os: windows-latest
            label: Windows
            build: npm run dist:win
            artifacts: |
              desktop/dist/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage the shared server/ and public/ folders
        working-directory: desktop
        run: npm run stage

      # ----- macOS: sign + notarize only when the Apple secrets exist -------
      - name: Build (signed + notarized)
        if: matrix.os == 'macos-latest' && env.MAC_CSC_LINK != ''
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config electron-builder.yml --mac --config.mac.notarize=true

      # ----- Windows: sign only when the Windows certificate exists ---------
      - name: Build (signed)
        if: matrix.os == 'windows-latest' && env.WIN_CSC_LINK != ''
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --config electron-builder.yml --win

      # ----- Unsigned fallback: still produces a real, installable build ----
      - name: Build (unsigned)
        if: |
          startsWith(matrix.os, 'ubuntu') ||
          (matrix.os == 'macos-latest' && env.MAC_CSC_LINK == '') ||
          (matrix.os == 'windows-latest' && env.WIN_CSC_LINK == '')
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.build }}

      - name: List the produced installers
        shell: bash
        run: ls -lh desktop/dist || dir desktop\dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: EduSphere-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Publish: on a `v*` tag, collect every installer and attach them to the
  #    GitHub Release for that tag.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every installer
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh release

      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EduSphere ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
