name: Mobile apps (Android + iOS)

# =============================================================================
# EduSphere mobile (Phase 4) — builds the real phone/tablet apps on every push
# and attaches them to a GitHub Release when a `v*` tag is pushed.
#
# WHERE THIS FILE LIVES
#   This is the canonical workflow, versioned here because the automation that
#   opened this branch is a GitHub App WITHOUT the `workflows` permission, so a
#   file under .github/workflows/ cannot be pushed by it. To activate CI, run
#
#       mkdir -p .github/workflows
#       cp docs/ci/mobile-release.yml .github/workflows/mobile-release.yml
#
#   (or grant the app "Workflows: Read and write" and move the file there).
#   docs/INSTALL.md has the click-by-click version for a non-technical reader.
#   mobile/test/packaging.test.js reads the live path when present and this
#   copy otherwise, so the workflow is still verified by `npm test`.
#
#   NOTE ON `cap sync android` AND TypeScript
#   `capacitor.config.ts` is a TypeScript file, so the Capacitor CLI refuses to
#   start unless `typescript` is installed: it exits 1 with
#   "Could not find installation of TypeScript" BEFORE copying anything. That —
#   not the Gradle wrapper — is what made the Android job fail. `typescript` is
#   now a devDependency of mobile/package.json, so `npm ci` provides it.
#
#   `cap sync android` (= copy + update) is the right command, NOT `cap copy`:
#   only the update half writes `android/app/src/main/assets/capacitor.plugins.json`,
#   the file that registers @capacitor/app and @capacitor/network in the APK.
#   Neither command invokes Gradle; the build below uses the Gradle installed by
#   gradle/actions/setup-gradle, so no wrapper JAR is needed either way.
#
#   NOTE ON THE GUARD TESTS
#   The platform guard list carries `--test-force-exit` and skips
#   test/unified-login-ui.test.js: that suite is a known pre-existing failure
#   that also leaves an open handle, so it would fail — or hang — the gate
#   before the Android build starts.
#
# WHAT IT PRODUCES
#   Android  EduSphere-<version>-android-debug.apk      sideload / testers
#            EduSphere-<version>-android-release.apk     sideload, signed
#            EduSphere-<version>-android-release.aab     Play Console upload
#   iOS      EduSphere-<version>-ios.ipa                 TestFlight / App Store
#                                                        (macOS + Apple secrets)
#
# NO SECRETS ARE REQUIRED
#   • Without EDUSPHERE_KEYSTORE_* the Android release build is signed with the
#     debug key: it installs on a phone, it cannot be uploaded to Play. The job
#     prints which mode it used.
#   • Without Apple secrets the iOS job does not run at all (see the gate).
# =============================================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "mobile/**"
      - "public/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.3"
  JAVA_VERSION: "21"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast guard: the mobile suite is headless (no SDK, no simulator) and the
  #    native verification reads the committed projects as files.
  # ---------------------------------------------------------------------------
  test:
    name: Mobile tests & native verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies (guard tests)
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run the mobile test suite
        working-directory: mobile
        run: npm test

      - name: Verify the native projects (permissions, keychain, deep links, no eval)
        working-directory: mobile
        run: npm run verify

      # `--test-force-exit`: a known pre-existing failure in the root suite leaves
      # an open handle behind (a jsdom window that is never closed), so the test
      # process would otherwise sit there until the job timeout instead of
      # exiting. Forcing the exit keeps the guard fast and deterministic.
      #
      # `test/unified-login-ui.test.js` is deliberately NOT in the list below: it
      # is the known pre-existing failure (the fee-payment copy assertion) that
      # also leaks that open handle. Including it would fail — or hang — this gate
      # before the Android build starts. Login itself is still covered by
      # `test/admin-login.test.js` and by the full `npm test` run above.
      - name: Platform guard tests (SQL dialect, CSRF, login, offline sync)
        run: >
          node --disable-warning=ExperimentalWarning --test --test-force-exit
          test/sql-compat.test.js
          test/mysql-runtime.test.js
          test/card-scanner-csrf.test.js
          test/admin-login.test.js
          test/offline-frontend-sync.test.js

  # ---------------------------------------------------------------------------
  # 2. Android: a real Gradle build producing a sideload .apk and a Play .aab.
  # ---------------------------------------------------------------------------
  android:
    name: Build Android (.apk + .aab)
    needs: test
    runs-on: ubuntu-latest
    env:
      # Read once here: a step-level `if` cannot see `secrets` directly.
      EDUSPHERE_KEYSTORE_BASE64: ${{ secrets.EDUSPHERE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Stage the shared web bundle into the native project
        working-directory: mobile
        run: npm run sync-web

      # `capacitor.config.ts` needs TypeScript (a devDependency of mobile/, so
      # `npm ci` installed it): without it the CLI exits 1 with "Could not find
      # installation of TypeScript" before writing a single file — that was the
      # real Android failure, not the missing Gradle wrapper JAR.
      #
      # `sync` = `copy` + `update`. `copy` alone is not enough: only `update`
      # writes `android/app/src/main/assets/capacitor.plugins.json`, which is
      # what registers @capacitor/app (deep links) and @capacitor/network
      # (offline/online listener) inside the APK. Neither step runs Gradle — the
      # builds below use the toolchain from gradle/actions/setup-gradle — so
      # this is safe on a clean runner with no committed wrapper JAR.
      - name: Capacitor sync (web assets + config + plugins JSON)
        working-directory: mobile
        run: npx cap sync android

      - name: Decode the upload keystore (only when the secrets exist)
        id: keystore
        if: ${{ env.EDUSPHERE_KEYSTORE_BASE64 != '' }}
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.EDUSPHERE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/edusphere-upload.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: mobile
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK + AAB (signed)
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        working-directory: mobile
        env:
          EDUSPHERE_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/edusphere-upload.jks
          EDUSPHERE_KEYSTORE_PASSWORD: ${{ secrets.EDUSPHERE_KEYSTORE_PASSWORD }}
          EDUSPHERE_KEY_ALIAS: ${{ secrets.EDUSPHERE_KEY_ALIAS }}
          EDUSPHERE_KEY_PASSWORD: ${{ secrets.EDUSPHERE_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          echo "::notice::Release artifacts signed with the upload keystore."

      - name: Build release APK + AAB (debug-signed fallback, no secrets)
        if: ${{ steps.keystore.outputs.signed != 'true' }}
        working-directory: mobile
        run: |
          cd android
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          echo "::warning::No EDUSPHERE_KEYSTORE_* secrets: the release APK/AAB is DEBUG-SIGNED. It installs on a phone but Play will reject the .aab. See docs/MOBILE-APP.md."

      - name: Collect artifacts
        working-directory: mobile
        run: |
          mkdir -p dist/android
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/EduSphere-${VERSION}-android-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/EduSphere-${VERSION}-android-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/android/EduSphere-${VERSION}-android-release.aab"
          ls -lh dist/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduSphere-Android
          path: mobile/dist/android/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. iOS/iPadOS: macOS runner, Xcode archive + exportArchive (.ipa).
  #
  #    GATE: a job-level `if` cannot read `secrets`, so the switch is a
  #    repository VARIABLE (Settings → Variables → EDUSPHERE_IOS_BUILD=true),
  #    and the signing steps additionally require the Apple secrets. Add:
  #
  #      APPLE_TEAM_ID, APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,
  #      APPLE_PROVISIONING_PROFILE_BASE64, APPLE_KEYCHAIN_PASSWORD
  #
  #    With no secrets at all the job is skipped and no macOS minutes are spent.
  # ---------------------------------------------------------------------------
  ios:
    name: Build iOS (.ipa)
    needs: test
    if: ${{ vars.EDUSPHERE_IOS_BUILD == 'true' }}
    runs-on: macos-latest
    env:
      # A step-level `if` cannot see `secrets`, so they are lifted here and the
      # conditions below read the `env` context instead.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the Xcode project (canonical cap add + EduSphere sources)
        working-directory: mobile
        run: npm run add:ios

      - name: Stage the shared web bundle
        working-directory: mobile
        run: npm run sync-web

      - name: Capacitor sync (pods + config)
        working-directory: mobile
        run: npx cap sync ios

      - name: Import the signing certificate (secret-gated)
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install the provisioning profile (secret-gated)
        if: ${{ env.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/edusphere.mobileprovision

      # ----- Signed build: xcodebuild archive → xcodebuild -exportArchive ----
      - name: Archive (xcodebuild archive)
        if: ${{ env.APPLE_TEAM_ID != '' }}
        working-directory: mobile/ios/App
        env:
          EDUSPHERE_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ../dist/ios
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../dist/ios/EduSphere.xcarchive \
            DEVELOPMENT_TEAM="${EDUSPHERE_IOS_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Prepare ExportOptions.plist
        if: ${{ env.APPLE_TEAM_ID != '' }}
        working-directory: mobile
        env:
          EDUSPHERE_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node -e "require('./scripts/build-ios').writeExportOptions()"

      - name: Export the .ipa (xcodebuild -exportArchive)
        if: ${{ env.APPLE_TEAM_ID != '' }}
        working-directory: mobile
        env:
          EDUSPHERE_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EDUSPHERE_IOS_METHOD: app-store
        run: |
          mkdir -p dist/ios/ipa
          xcodebuild -exportArchive \
            -archivePath dist/ios/EduSphere.xcarchive \
            -exportPath dist/ios/ipa \
            -exportOptionsPlist dist/ios/ExportOptions.plist
          ls -lh dist/ios/ipa

      # ----- No Apple secrets: still prove the project compiles --------------
      - name: Archive unsigned (no Apple secrets configured)
        if: ${{ env.APPLE_TEAM_ID == '' }}
        working-directory: mobile
        run: |
          echo "::warning::No APPLE_TEAM_ID secret: building an UNSIGNED archive only. Add the Apple secrets to produce a TestFlight-ready .ipa."
          npm run ios:build

      - name: Upload the .ipa
        if: ${{ env.APPLE_TEAM_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EduSphere-iOS
          path: mobile/dist/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish: on a `v*` tag, attach every phone/tablet artifact to the
  #    GitHub Release for that tag.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [android, ios]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every mobile artifact
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh release

      - name: Attach the apps to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EduSphere ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
