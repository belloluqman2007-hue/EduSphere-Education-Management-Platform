<head>

  <link rel="canonical" href="/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EduSphere">

  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/student-management.css">
  <link rel="stylesheet" href="/css/admin-teacher-classes.css">

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app"></div>
  <script src="/app-config.js"></script>
  <!-- Native shell (Capacitor Android/iOS). native-boot.js is a no-op in a
       browser; inside the phone/tablet shell it pulls in native-bridge.js (the
       SAME frozen window.__EDUSPHERE_NATIVE__ contract the Electron preload
       exposes, so api.js mints Phase 1 Bearer device tokens unchanged),
       mobile-storage.js (the offline database on real SQLite) and
       mobile-shell.js. Keeping them out of the browser keeps the web app's boot
       exactly as fast as it was before Phase 4. -->
  <script src="/js/native-boot.js"></script>
  <script defer src="/js/mobile-updates.js"></script>
  <script src="/js/print-page.js"></script>
  <script src="/js/api.js"></script>
  <!-- Local-first storage, offline transport interceptor & sync UI. They load
       immediately after api.js so the interceptor is installed before any
       screen issues its first request. -->
  <script src="/js/offline-db.js"></script>
  <script src="/js/sync-engine.js"></script>
  <script src="/js/sync-ui.js"></script>
  <script src="/js/register.js"></script>
  <script src="/js/register-academy.js"></script>
  <script src="/js/my-institution.js"></script>
  <script src="/js/admin-teacher-classes.js"></script>
  <script src="/js/academic-admissions.js"></script>
  <script src="/js/payroll.js"></script>
  <script src="/js/leave.js"></script>
  <script src="/js/library.js"></script>
  <script src="/js/health.js"></script>
  <script src="/js/ptm.js"></script>
  <script src="/js/parent-ptm.js"></script>
  <script src="/js/expenses.js"></script>
  <script src="/js/profile-photo.js"></script>
  <script src="/js/card-scanner.js"></script>
  <script src="/js/certificate-designer.js"></script>
  <script src="/js/portal.js"></script>
  <script src="/js/portal-teacher.js"></script>
  <script src="/js/portal-student.js"></script>
  <script src="/js/portal-parent.js"></script>
  <script src="/js/support-chat.js"></script>
  <script src="/js/subscription.js"></script>
  <script src="/js/edusphere-ai.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/app.js"></script>
  <!-- EduSphere AI is mounted from its own file: the platform sends a strict
       script-src 'self' CSP, so an inline mount script would be blocked. -->
  <script src="/js/ai-boot.js"></script>
</body>
</html>
