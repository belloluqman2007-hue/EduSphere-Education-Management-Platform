# ============================================================================
# MULTI-MADRASA PLATFORM — NEW Render service definition
# ----------------------------------------------------------------------------
# This file describes a BRAND-NEW service. It does not reference, import, or
# attach to any existing/old deployment. Provision it as a new service in a
# new Render team/project and fill in the sync:false values with NEW values.
# No live secrets are stored in this file.
# ============================================================================
services:
  - type: web
    name: multi-madrasa-platform
    runtime: node
    # The Node runtime is pinned with NODE_VERSION below and .node-version.
    # Render Free has no persistent disk; MySQL stores application data and media.
    plan: free
    # The free service uses one instance.
    numInstances: 1
    # EU region = lowest latency to Nigeria; change freely.
    region: frankfurt
    # Do not auto-deploy main; deploy deliberately from this branch.
    autoDeploy: false
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # Do not add a disk here: Render Free does not support persistent disks.
    # /tmp is scratch space only; DATABASE_URL must point at persistent MySQL.
    envVars:
      # Render's supported way to select Node. Keep this aligned with
      # .node-version and package.json; Node 22 provides node:sqlite for the
      # supported local/demo SQLite mode.
      - key: NODE_VERSION
        value: "22.22.3"
      - key: NODE_ENV
        value: production
      - key: DATABASE_DRIVER
        value: mysql
      # NEW database — create a fresh MySQL DB (see docs/DATABASE.md).
      # Never paste the old production connection string here.
      - key: DATABASE_URL
        sync: false
      # Aiven requires TLS. The existing MySQL driver encrypts this connection.
      - key: DB_SSL
        value: "true"
      # Auto-generated long secret for session signing + CSRF.
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: admin
      # Set in dashboard; strong, unique, NEW.
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # New service URL (set after creation, or use Render's assigned URL).
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: API_RATE_LIMIT
        value: "300"
      # Scratch paths are writable but are erased by Render; they are not backups.
      - key: DATA_DIR
        value: /tmp/edusphere
      - key: UPLOAD_DIR
        value: /tmp/edusphere/uploads
      - key: BACKUP_DIR
        value: /tmp/edusphere/backups
      - key: PERSISTENT_VOLUME_DIR
        value: /var/data
      # Local snapshots are ephemeral. Use Aiven backups and export copies.
      - key: BACKUP_INTERVAL_MINUTES
        value: "0"
      - key: AUTO_RESTORE_ON_EMPTY_DB
        value: "0"
      - key: MAX_UPLOAD_MB
        value: "5"
      # Logged-out (public site) traffic gets its own buckets.
      - key: PUBLIC_RATE_LIMIT
        value: "600"
      - key: PUBLIC_APPLY_LIMIT
        value: "8"
      - key: PUBLIC_VERIFY_LIMIT
        value: "12"
